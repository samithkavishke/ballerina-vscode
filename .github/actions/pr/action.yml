name: 'Create PR and send notification'
inputs:
  version:
    description: 'Publish version'
    required: true
  isPreRelease:
    default: 'true'
  chatAPI:
    description: 'Google chat API'
    required: true
  ref_name:
    description: 'Branch name'
    required: true
  threadKey:
    description: 'Google Chat thread key for grouping release notifications'
    required: false
    default: ''
  ballerina:
    description: 'Is Ballerina'
    default: 'false'
    required: true
  commonLibs:
    description: 'Is Common Lib'
    default: 'false'
    required: true

runs:
  using: "composite"
  steps:
      - name: Config git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Ballerina git changes
        if: ${{ inputs.ballerina == 'true' }}
        shell: bash
        # The root package.json is the authored version; the extension's manifest and the
        # LS's gradle.properties are both generated from it by sync-version.js, so all
        # three have to travel together or the committed tree is internally inconsistent.
        run: git add package.json packages/*/package.json packages/ballerina-language-server/gradle.properties

      - name: Add common lib git changes
        if: ${{ inputs.commonLibs == 'true' }}
        shell: bash
        run: git add submodules/wso2-vscode-extensions/workspaces/common-libs/*/package.json

      - name: Commit version
        shell: bash
        id: commit
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git diff --staged --quiet || git commit -m "Update version to ${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create tag
        shell: bash
        id: create_tag
        run: |
          git tag ${{ inputs.version }}
          git push origin "refs/tags/${{ inputs.version }}"

      - name: Create release branch
        shell: bash
        if: ${{ inputs.isPreRelease == 'false' }}
        id: create_branch
        run: |
          git checkout -b "${{ inputs.version }}"
          git push origin "refs/heads/${{ inputs.version }}"

      - name: Create Pull Request
        shell: bash
        if: ${{ inputs.isPreRelease == 'false' }}
        id: pr
        run: |
          baseBranch="stable/ballerina"
          pr=$(gh pr create -B "$baseBranch" -H "${{ inputs.version }}" --title "Merge \"${{ inputs.version }}\" into \"$baseBranch\"" --body '$subject')
          echo "prURL=$pr" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      # Every other build path derives its version from a 'major.minor.patch-SNAPSHOT'
      # root version, so main has to be returned to a snapshot after a release. Without
      # this, main is left holding the concrete released version (directly, or via the
      # sync PR from stable/ballerina) and the very next nightly fails: the derivation
      # requires a snapshot. Opening a PR rather than pushing keeps branch protection
      # on main intact.
      - name: Open next-snapshot PR against main
        shell: bash
        if: ${{ inputs.isPreRelease == 'false' }}
        id: snapshot_pr
        run: |
          set -euo pipefail
          released=$(node -p "require('./package.json').version")
          nextSnapshot=$(node -e '
            const [major, minor] = process.argv[1].split(".");
            console.log(`${major}.${Number(minor) + 1}.0-SNAPSHOT`);
          ' "$released")

          git fetch origin main
          branch="bump/next-snapshot-${nextSnapshot}"
          git checkout -B "$branch" origin/main
          npm version "$nextSnapshot" --no-git-tag-version
          node common/scripts/sync-version.js
          git add package.json packages/*/package.json packages/ballerina-language-server/gradle.properties

          if git diff --staged --quiet; then
            echo "main is already at ${nextSnapshot}; nothing to open."
            exit 0
          fi

          git commit -m "Bump main to ${nextSnapshot} after ${released}"
          git push --force origin "refs/heads/${branch}"
          pr=$(gh pr create -B main -H "$branch" \
            --title "Bump main to ${nextSnapshot} after the ${released} release" \
            --body "Returns the root version to a snapshot so nightly and pre-release builds can derive a version again. Generated by the ${released} release run.")
          echo "prURL=$pr" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: "PR Notification"
        if: ${{ inputs.isPreRelease == 'false' }}
        shell: bash
        run: |
          THREAD_KEY="${{ inputs.threadKey }}"
          if [ -n "${THREAD_KEY}" ]; then
            THREAD_FIELD='"thread": {"threadKey": "'"${THREAD_KEY}"'"},'
            URL_SUFFIX="&messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD"
          else
            THREAD_FIELD=""
            URL_SUFFIX=""
          fi
          body=$(cat << EOF
          {
            ${THREAD_FIELD}
            "cards": [
              {
                "header": {
                    "title": "New Release PR"
                },
                "sections": [
                  {
                    "widgets": [
                      {
                        "keyValue": {
                          "topLabel": "Pull Request",
                          "content": "${{ steps.pr.outputs.prURL }}",
                          "button": {
                            "textButton": {
                              "text": "Merge",
                              "onClick": {
                                "openLink": {
                                  "url": "${{ steps.pr.outputs.prURL }}"
                                }
                              }
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )
          curl \
            -X POST \
            -H 'Content-Type: application/json' \
            "${{ inputs.chatAPI }}${URL_SUFFIX}" \
            -d "$body"
