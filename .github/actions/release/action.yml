name: 'Release vsix to github and notify'
description: 'Creates a GitHub release with the VSIX asset and sends a Google Chat notification'
inputs:
  repo:
    description: 'Github repository name'
    required: true
  name:
    description: 'File name'
    required: true
  chatAPI:
    description: 'Google chat API'
    required: true
  threadKey:
    description: 'Google Chat thread key for grouping release notifications'
    required: false
    default: ''
  tag:
    description: >-
      Fixed, rolling release tag (e.g. "nightly"). When set, any existing
      release + git tag with this name is deleted and recreated, so the tag
      always points at the latest build. When empty (default), a unique
      "v<version>" release is created without deleting anything.
    required: false
    default: ''
  extraAssets:
    description: >-
      Additional files to attach to the release, one path or glob per line
      (e.g. the language-server jar bundled in the VSIX). Each is uploaded with
      the same replace-safely semantics as the VSIX. A glob that matches nothing
      fails the job — a silently missing asset is worse than a red build.
    required: false
    default: ''
  releaseBranch:
    description: >-
      Commit the resolved version and push 'release/<version>', then tag that
      commit instead of the workflow's own. Set only for a real release; the
      version that was packaged lives in the working tree (updateVersion wrote it
      during the build) and is otherwise never committed anywhere. Left false for
      pre-releases and for the rolling nightly, whose version commit sync-nightly
      has already made and pushed.
    required: false
    default: 'false'
  ballerina:
    description: 'Stage the Ballerina version files when committing'
    required: false
    default: 'false'
  commonLibs:
    description: 'Stage the common-libs version files when committing'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Get version
      shell: bash
      id: vsix
      run: |
        file=$(ls ${{ inputs.name }}-[0-9]*.[0-9]*.[0-9]*.vsix)
        extension=${{ inputs.name }}
        # Strip the '<name>-' prefix and the '.vsix' suffix rather than cutting at
        # the last '-': the name itself contains a '-', and a version may carry a
        # prerelease id, either of which a trailing-dash cut would mangle.
        version=${file#${extension}-}
        version=${version%.vsix}
        extensionName="$(echo "$extension" | sed 's/.*/\u&/')"
        # A non-empty `tag` input selects the rolling release (e.g. nightly);
        # otherwise fall back to a unique per-version tag.
        if [ -n "${{ inputs.tag }}" ]; then
          releaseTag="${{ inputs.tag }}"
          releaseName="Nightly Build (v${version})"
        else
          releaseTag="v${version}"
          releaseName="Release v${version}"
        fi
        echo "vsixName=$file" >> $GITHUB_OUTPUT
        echo "version=$version" >> $GITHUB_OUTPUT
        echo "extensionName=$extensionName" >> $GITHUB_OUTPUT
        echo "releaseTag=$releaseTag" >> $GITHUB_OUTPUT
        echo "releaseName=$releaseName" >> $GITHUB_OUTPUT

    # ── Release refs ─────────────────────────────────────────────────────────
    # Only for a real release. The version the build packaged exists solely in the
    # working tree — updateVersion wrote it there during the build — so committing it
    # here is what gives the release a commit whose tree actually carries its version,
    # and the tag below then points at that commit rather than at the dispatched one.
    - name: Config git
      if: ${{ inputs.releaseBranch == 'true' }}
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

    - name: Resolve release refs
      if: ${{ inputs.releaseBranch == 'true' }}
      shell: bash
      id: refs
      env:
        VSIX_VERSION: ${{ steps.vsix.outputs.version }}
      run: |
        set -euo pipefail
        version=$(node -p "require('./package.json').version")
        case "${version}" in
          *-SNAPSHOT)
            echo "::error::Refusing to release the snapshot version '${version}';" \
                 "updateVersion should have resolved it before packaging."
            exit 1
            ;;
        esac
        # The VSIX is named from the generated extension manifest, which sync-version.js
        # generates from this same root version, so the two must agree. If they do not, the
        # artifact about to be tagged is not the one this version describes.
        if [ "${version}" != "${VSIX_VERSION}" ]; then
          echo "::error::Root package.json says ${version} but the VSIX is ${VSIX_VERSION}."
          exit 1
        fi
        # Even minors are release lines, odd minors the pre-release channel, so a release
        # always belongs to the 'X.Y.x' line of its own minor.
        line=$(node -e '
          const [major, minor] = process.argv[1].split(".");
          console.log(`${major}.${minor}.x`);
        ' "${version}")
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "line=${line}" >> "$GITHUB_OUTPUT"
        echo "branch=release/${version}" >> "$GITHUB_OUTPUT"

    - name: Stage Ballerina version files
      if: ${{ inputs.releaseBranch == 'true' && inputs.ballerina == 'true' }}
      shell: bash
      # The root package.json is the authored version; the extension's manifest and the
      # LS's gradle.properties are both generated from it by sync-version.js, so all
      # three have to travel together or the committed tree is internally inconsistent.
      run: git add package.json packages/*/package.json packages/ballerina-language-server/gradle.properties

    - name: Stage common lib version files
      if: ${{ inputs.releaseBranch == 'true' && inputs.commonLibs == 'true' }}
      shell: bash
      run: git add submodules/wso2-vscode-extensions/workspaces/common-libs/*/package.json

    - name: Commit version and push the release branch
      if: ${{ inputs.releaseBranch == 'true' }}
      shell: bash
      id: release_branch
      run: |
        set -euo pipefail
        branch="${{ steps.refs.outputs.branch }}"
        git diff --staged --quiet || git commit -m "Update version to ${{ steps.refs.outputs.version }}"

        # Reused rather than recreated, so re-running a release (or a branch someone cut by
        # hand to carry a fix) does not fail on an existing ref. In that case the tag has to
        # follow the branch that is actually there: tagging the local commit would name a
        # commit the remote does not have, and the releases API would reject it.
        if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
          sha=$(git ls-remote --heads origin "${branch}" | cut -f1)
          echo "::notice::${branch} already exists at ${sha}; leaving it untouched."
        else
          sha=$(git rev-parse HEAD)
          git push origin "${sha}:refs/heads/${branch}"
          echo "Created ${branch} at ${sha}"
        fi
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - name: Create a release in ${{ inputs.repo }} repo
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ inputs.repo }}
        TAG: ${{ steps.vsix.outputs.releaseTag }}
        RELEASE_NAME: ${{ steps.vsix.outputs.releaseName }}
        VSIX: ${{ steps.vsix.outputs.vsixName }}
        EXTRA_ASSETS: ${{ inputs.extraAssets }}
        ROLLING: ${{ inputs.tag != '' }}
        # The commit the release tag points at: the version commit when a release branch was
        # pushed, otherwise the commit the workflow itself is running on (pre-releases, and the
        # rolling nightly, whose version commit is already on the nightly branch).
        TARGET_COMMIT: ${{ steps.release_branch.outputs.sha || github.sha }}
      run: |
        set -euo pipefail
        API="https://api.github.com/repos/${REPO}"

        # Bounded timeouts so a hung GitHub API call can't stall the job until
        # the job-level timeout. The metadata calls are small; the asset upload
        # ships a ~100MB VSIX, so it gets a much larger budget.
        CURL_API=(curl -sS --connect-timeout 15 --max-time 60)
        CURL_UPLOAD=(curl -sS --connect-timeout 15 --max-time 900)

        # On the rolling path (e.g. nightly) the release is REUSED rather than
        # deleted and recreated. Nothing is destroyed until the replacement
        # artifact is uploaded and verified, so a failed run always leaves the
        # previous nightly downloadable. That matters because the whole point of
        # a fixed tag is a URL that keeps working; deleting first would take
        # 'releases/download/<tag>/...' offline until the next successful build.
        existingId=""
        existingAssets="[]"
        if [ "${ROLLING}" = "true" ]; then
          existing=$("${CURL_API[@]}" -H "Authorization:token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "${API}/releases/tags/${TAG}")
          existingId=$(echo "${existing}" | jq -r '.id // empty')
          existingAssets=$(echo "${existing}" | jq -c '.assets // []')
        fi

        if [ -n "${existingId}" ]; then
          echo "Reusing existing release ${existingId} for tag ${TAG}"
          id="${existingId}"
        else
          createResponse=$("${CURL_API[@]}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization:token ${GH_TOKEN}" \
            "${API}/releases" \
            -d "$(jq -n \
              --arg tag "${TAG}" \
              --arg name "${RELEASE_NAME}" \
              --arg commit "${TARGET_COMMIT}" \
              '{tag_name: $tag, target_commitish: $commit, draft: false, name: $name, prerelease: true}')")
          id=$(echo "${createResponse}" | jq -r '.id // empty')
          if [ -z "${id}" ]; then
            echo "Failed to create release:" >&2
            echo "${createResponse}" >&2
            exit 1
          fi
        fi

        # Uploads one file, replacing any same-named asset already on the release.
        # Asset names must be unique within a release, and a rolling release's
        # assets have the same filenames every run — so the replacement is uploaded
        # under a temp name and renamed only after the old one is gone.
        publish_asset() {
          local file="$1"
          local name
          name="$(basename "${file}")"

          # Clear any temp asset left behind by a previously failed run, or this
          # upload would 422.
          local staleId
          staleId=$(echo "${existingAssets}" | jq -r --arg n "${name}.new" \
            '.[] | select(.name == $n) | .id' | head -n 1)
          if [ -n "${staleId}" ]; then
            echo "Removing stale temp asset ${staleId} (${name}.new)"
            "${CURL_API[@]}" -X DELETE -H "Authorization:token ${GH_TOKEN}" \
              "${API}/releases/assets/${staleId}"
          fi

          # curl exits 0 on a non-2xx HTTP response, so 'set -e' alone would let a
          # rejected upload (auth, size limit, rate limit) pass as success, leaving
          # a release whose artifact silently never arrived.
          local uploadResponse assetId
          uploadResponse=$("${CURL_UPLOAD[@]}" -X POST \
            -H "Authorization:token ${GH_TOKEN}" \
            -H "Content-Type:application/octet-stream" \
            --data-binary "@${file}" \
            "https://uploads.github.com/repos/${REPO}/releases/${id}/assets?name=${name}.new")
          assetId=$(echo "${uploadResponse}" | jq -r '.id // empty')
          if [ -z "${assetId}" ]; then
            echo "Failed to upload ${file} to release ${id}:" >&2
            echo "${uploadResponse}" >&2
            return 1
          fi

          # The new artifact is safely uploaded — only now retire the old one.
          local oldId
          oldId=$(echo "${existingAssets}" | jq -r --arg n "${name}" \
            '.[] | select(.name == $n) | .id' | head -n 1)
          if [ -n "${oldId}" ]; then
            echo "Deleting superseded asset ${oldId} (${name})"
            "${CURL_API[@]}" -X DELETE -H "Authorization:token ${GH_TOKEN}" \
              "${API}/releases/assets/${oldId}"
          fi

          local renameResponse
          renameResponse=$("${CURL_API[@]}" -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization:token ${GH_TOKEN}" \
            "${API}/releases/assets/${assetId}" \
            -d "$(jq -n --arg name "${name}" '{name: $name}')")
          if [ -z "$(echo "${renameResponse}" | jq -r '.id // empty')" ]; then
            echo "Failed to rename asset ${assetId} to ${name}:" >&2
            echo "${renameResponse}" >&2
            return 1
          fi
          echo "Uploaded ${name} as asset ${assetId}"
        }

        publish_asset "${VSIX}"

        # Extra assets (e.g. the bundled language-server jar). Globs are expanded
        # here rather than by the caller so the workflow can name the artifact
        # without knowing the timestamped version.
        while IFS= read -r pattern; do
          [ -n "${pattern}" ] || continue
          # shellcheck disable=SC2206 # deliberate glob expansion
          matches=(${pattern})
          if [ ! -e "${matches[0]}" ]; then
            echo "No file matched extra asset pattern '${pattern}'" >&2
            exit 1
          fi
          for file in "${matches[@]}"; do
            publish_asset "${file}"
          done
        done <<< "${EXTRA_ASSETS}"

        # Refresh the reused release's title, and move the tag to this commit so
        # the rolling tag tracks the newest build. Both happen after a verified
        # upload, so tag and artifact never disagree on a failed run.
        if [ -n "${existingId}" ]; then
          releasePatch=$("${CURL_API[@]}" -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization:token ${GH_TOKEN}" \
            "${API}/releases/${id}" \
            -d "$(jq -n --arg name "${RELEASE_NAME}" \
              '{name: $name, draft: false, prerelease: true}')")
          if [ -z "$(echo "${releasePatch}" | jq -r '.id // empty')" ]; then
            echo "Failed to update release ${id}:" >&2
            echo "${releasePatch}" >&2
            exit 1
          fi
          # Compare the returned ref target rather than just checking for a body:
          # a rejected ref update (missing ref, concurrent move) would otherwise
          # leave ${TAG} on a stale commit while the release serves the new VSIX.
          refPatch=$("${CURL_API[@]}" -X PATCH \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization:token ${GH_TOKEN}" \
            "${API}/git/refs/tags/${TAG}" \
            -d "$(jq -n --arg sha "${GITHUB_SHA}" \
              '{sha: $sha, force: true}')")
          if [ "$(echo "${refPatch}" | jq -r '.object.sha // empty')" != "${GITHUB_SHA}" ]; then
            echo "Failed to move tag ${TAG} to ${GITHUB_SHA}:" >&2
            echo "${refPatch}" >&2
            exit 1
          fi
          echo "Moved tag ${TAG} to ${GITHUB_SHA}"
        fi

    - name: "Release Notification"
      shell: bash
      run: |
        # Unset on a fork, where the curl below would target a bare query string, fail, and
        # fail the job even though the release itself succeeded.
        if [ -z "${{ inputs.chatAPI }}" ]; then
          echo "::notice::chatAPI is empty; skipping the release notification."
          exit 0
        fi
        THREAD_KEY="${{ inputs.threadKey }}"
        if [ -n "${THREAD_KEY}" ]; then
          THREAD_FIELD='"thread": {"threadKey": "'"${THREAD_KEY}"'"},'
          URL_SUFFIX="&messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD"
        else
          THREAD_FIELD=""
          URL_SUFFIX=""
        fi
        body=$(cat << EOF
        {
          ${THREAD_FIELD}
          "cards": [
            {
              "header": {
                  "title": "VSIX Published - ${{ inputs.name }}"
              },
              "sections": [
                {
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "VSIX",
                        "content": "v${{ steps.vsix.outputs.version }}",
                        "onClick": {
                          "openLink": {
                            "url": "https://github.com/${{ inputs.repo }}/releases/tag/${{ steps.vsix.outputs.releaseTag }}"
                          }
                        },
                        "iconUrl": "https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Visual_Studio_Code_1.35_icon.svg/512px-Visual_Studio_Code_1.35_icon.svg.png",
                        "button": {
                          "textButton": {
                            "text": "Download VSIX",
                            "onClick": {
                              "openLink": {
                                "url": "https://github.com/${{ inputs.repo }}/releases/download/${{ steps.vsix.outputs.releaseTag }}/${{ steps.vsix.outputs.vsixName }}"
                              }
                            }
                          }
                        }
                      }
                    }
                  ]
                }
              ]
            }
          ]
        }
        EOF
        )
        curl \
          -X POST \
          -H 'Content-Type: application/json' \
          "${{ inputs.chatAPI }}${URL_SUFFIX}" \
          -d "$body"
