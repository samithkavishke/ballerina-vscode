name: Update package version
description: >-
  Resolves the version for this build from the root package.json — the single
  source of truth, which always carries the next release as
  'major.minor.patch-SNAPSHOT' — and propagates it to every derived copy
  (the extension's package.json and the language server's gradle.properties).
inputs:
  version:
    description: >-
      Explicit version override. Leave empty (or 'N/A') to derive the version from
      the root package.json. Bump kinds are no longer meaningful: from a
      '-SNAPSHOT' base, 'npm version patch' and 'npm version minor' both just drop
      the prerelease id, so they would silently produce the same version.
    required: false
    default: ''
  isPreRelease:
    description: >-
      Marketplace pre-release. Uses the same timestamped version as a nightly (see
      'nightly'), and separately drives 'vsce package --pre-release' in
      actions/build.
    default: 'true'
  nightly:
    description: >-
      Nightly build. Uses the same derivation as a pre-release —
      major.(minor-1).<yymmddHHmm> from the root '-SNAPSHOT' version, see
      common/scripts/nightly-version.js — but is a separate input because it selects
      only the version. Packaging is isPreRelease's job, and a nightly passes both:
      it is a pre-release, so it is packaged as one.
    default: 'false'
outputs:
  version:
    description: 'The resolved version, as written to package.json'
    value: ${{ steps.resolve.outputs.version }}
runs:
  using: "composite"
  steps:
    # Applied before the derivation steps, so an override can also serve as the
    # base a timestamped version is derived from.
    - name: Apply version override
      if: ${{ inputs.version != '' && inputs.version != 'N/A' }}
      shell: bash
      run: npm version ${{ inputs.version }} --no-git-tag-version

    - name: Get timestamp
      shell: bash
      id: timestamp
      run: |
        # Minute granularity: a nightly and a pre-release cut on the same day must
        # not collide on a version string. Must match nightly-version.js's own UTC
        # fallback format.
        timestamp=$(date -u '+%y%m%d%H%M')
        echo "timestamp=$timestamp" >> $GITHUB_OUTPUT

    # Nightlies and pre-releases share one derivation: the root version names the
    # NEXT release as a snapshot, and both of these are unreleased work heading
    # toward it, so they are published as major.(minor-1).<yymmddHHmm> — above every
    # release of the previous line, below the release main is heading for. See
    # common/scripts/nightly-version.js for the full rationale.
    #
    # Only a '-SNAPSHOT' root is derived from, and only main carries one. Release
    # lines ('5.14.x') and staging branches ('alpha') carry a concrete version that
    # is authored by hand, so a pre-release cut from one of those ships exactly what
    # the file says — nightly-version.js would (correctly) refuse to derive from it.
    - name: Set timestamped version
      shell: bash
      if: ${{ inputs.nightly == 'true' || inputs.isPreRelease == 'true' }}
      run: |
        set -euo pipefail
        currentVersion=$(node -p "require('./package.json').version")
        case "${currentVersion}" in
          *-SNAPSHOT) ;;
          *)
            echo "Root version ${currentVersion} is not a snapshot; publishing it as authored."
            exit 0
            ;;
        esac
        newVersion=$(node common/scripts/nightly-version.js --timestamp "${{ steps.timestamp.outputs.timestamp }}")
        echo "Timestamped version: $newVersion"
        npm version "$newVersion" --no-git-tag-version

    # A real release ships exactly what the snapshot named: 5.14.0-SNAPSHOT -> 5.14.0.
    - name: Set release version
      shell: bash
      if: ${{ inputs.nightly != 'true' && inputs.isPreRelease != 'true' }}
      run: |
        set -euo pipefail
        currentVersion=$(node -p "require('./package.json').version")
        newVersion="${currentVersion%-SNAPSHOT}"
        if [ "$newVersion" != "$currentVersion" ]; then
          echo "Release version: $newVersion"
          npm version "$newVersion" --no-git-tag-version
        fi

    - name: Resolve and propagate version
      shell: bash
      id: resolve
      run: |
        set -euo pipefail
        # Read the version back rather than reusing a composed string: npm's loose
        # parse normalizes on write, so only the value actually in the root
        # package.json is authoritative.
        version=$(node -p "require('./package.json').version")
        echo "Resolved version: $version"
        # The root version is a '-SNAPSHOT' placeholder for the next release, never
        # something to ship. Reaching here with it intact means no derivation ran,
        # so the build would package 'ballerina-5.14.0-SNAPSHOT.vsix'. Fail instead.
        case "$version" in
          *-SNAPSHOT)
            echo "::error::Refusing to build at the snapshot version '${version}'." \
                 "Pass an explicit 'version', or isPreRelease/nightly to derive one."
            exit 1
            ;;
        esac
        # Refresh both generated copies now (the extension manifest and the LS's
        # gradle.properties), so the version a CI commit carries is consistent across all
        # three files. Each project's own build re-runs this anyway; doing it here means
        # the committed tree is never internally inconsistent.
        node common/scripts/sync-version.js
        echo "version=$version" >> $GITHUB_OUTPUT
