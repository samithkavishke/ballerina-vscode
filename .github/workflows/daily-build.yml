name: Daily Build

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      sourceBranch:
        description: >-
          Branch to copy into `nightly`. Defaults to main, which is what the
          schedule always uses. Override it to dry-run the whole daily pipeline
          against a feature branch — note that this also makes the pipeline pick
          up that branch's .github/actions, since they are resolved from the
          checked-out nightly tree.
        required: false
        default: ''

permissions:
  contents: read
  packages: read

# The nightly branch is force-pushed by sync-nightly, so two concurrent runs
# (e.g. the schedule and a manual dispatch) must not interleave: the second would
# move the branch out from under the first's build.
concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Nightly branch — always main plus a single version commit
  #
  # The branch is reset to the source branch (main, on the schedule) every run and
  # force-pushed, so it is never a merge target and never accumulates history:
  # `git diff main nightly` is always exactly the version bump. Its purpose is to
  # give every nightly VSIX an inspectable commit that pins both the source and
  # the version it was built at.
  #
  # Note that .github/actions/* used by the downstream jobs resolve from the
  # checked-out nightly tree, so a change to them only takes effect for the daily
  # build once it is on main (or via the sourceBranch dispatch input).
  #
  # The version is derived from the root package.json — the single source of truth,
  # which on main always reads 'major.minor.patch-SNAPSHOT' — as
  # major.(minor-1).<yymmddHHmm>, e.g. 5.14.0-SNAPSHOT -> 5.13.2607290130. It is
  # propagated by sync-version.js to the extension's package.json and the language
  # server's gradle.properties, so the extension and the bundled LS always report the
  # same version. See common/scripts/nightly-version.js.
  # ─────────────────────────────────────────────────────────────────────────
  sync-nightly:
    name: Sync nightly branch
    # Deliberately NOT gated on the upstream repository: a fork pushing a nightly
    # branch to itself is harmless, and gating here would make every downstream job
    # (which all 'needs' this one) skip, leaving forks unable to dry-run the daily
    # build at all. Publishing and notifying stay gated.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Reset nightly to the source branch
        env:
          SOURCE_BRANCH: ${{ inputs.sourceBranch || 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # checkout fetches only the triggering ref, so the source branch has to be
          # fetched explicitly even at fetch-depth 0.
          git fetch origin "${SOURCE_BRANCH}"
          git checkout -B nightly "origin/${SOURCE_BRANCH}"

      - name: Stamp nightly version
        id: stamp
        uses: ./.github/actions/updateVersion
        with:
          version: 'N/A'
          isPreRelease: 'false'
          nightly: 'true'

      - name: Commit and push nightly
        id: push
        run: |
          set -euo pipefail
          # The authored version plus both files updateVersion generated from it (the
          # extension manifest and the LS's gradle.properties), so the nightly commit is
          # internally consistent and the jar built from it carries the nightly version.
          git add package.json packages/*/package.json packages/ballerina-language-server/gradle.properties
          # Tolerate a no-op stamp (a re-run within the same hour of a source branch
          # that already carries this version) instead of failing on an empty commit.
          git diff --staged --quiet || git commit -m "Nightly build ${{ steps.stamp.outputs.version }}"
          # Force-push both creates the branch on the very first run and discards
          # yesterday's version commit, so nightly stays a single commit ahead of
          # main. Pushes made with GITHUB_TOKEN do not trigger workflows, so this
          # cannot re-enter the daily build.
          git push --force origin nightly
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # Ballerina language server — multi-branch pack & test
  # ─────────────────────────────────────────────────────────────────────────
  ls-prepare-matrix:
    name: LS prepare matrix
    needs: sync-nightly
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    outputs:
      targets: ${{ steps.resolve-targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target branches
        id: resolve-targets
        shell: bash
        run: |
          set -euo pipefail

          # Release lines are 'X.Y.x' with an even minor (5.14.x, 5.16.x); odd minors are the
          # pre-release channel and never get a branch. The pattern was '1.[0-9]+.x' when the
          # language server versioned itself independently — it now shares the extension's
          # version, so its lines are the repo's lines.
          latest_branch=$(git ls-remote --heads origin | awk -F'/' '/refs\/heads\/[0-9]+\.[0-9]+\.x$/ { print $NF }' | sort -V | tail -n 1)
          if [ -z "${latest_branch}" ]; then
            echo "No X.Y.x release branch found on origin; building from nightly only." >&2
          fi

          timestamp=$(date '+%Y%m%d-%H%M%S')
          targets='[]'

          # 'nightly' rather than 'main': it is main plus the version commit, so the
          # LS verified here is the same tree the extension build packages.
          branches="nightly"
          if [ -n "${latest_branch}" ]; then
            branches="nightly ${latest_branch}"
          fi

          for branch in ${branches}; do
            git fetch --depth=1 origin "${branch}:refs/remotes/origin/${branch}"

            if [ "${branch}" = "nightly" ]; then
              # The nightly branch already carries the timestamped version in the root
              # package.json, and its generated copy in gradle.properties. Reusing it here
              # means this verification build and the jar attached to the nightly release
              # are one and the same version, instead of two competing nightly version
              # schemes in one run.
              build_version=$(git show "origin/${branch}:package.json" | jq -r '.version')
              if [ -z "${build_version}" ] || [ "${build_version}" = "null" ]; then
                echo "Unable to resolve version from the root package.json on ${branch}" >&2
                exit 1
              fi
            else
              # A release line carries a concrete version — only main uses '-SNAPSHOT' — and its
              # gradle.properties holds the generated copy of it, so reading that file gives the
              # line's version whether the branch predates the single-source-of-truth change or
              # not. Suffixed with a timestamp because this is a verification build, not a release.
              branch_version=$(git show "origin/${branch}:packages/ballerina-language-server/gradle.properties" | awk -F= '$1 == "version" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); gsub(/\r/, "", $2); print $2; exit }')
              if [ -z "${branch_version}" ]; then
                echo "Unable to resolve version from gradle.properties for ${branch}" >&2
                exit 1
              fi
              build_version="${branch_version}-${timestamp}"
            fi

            targets=$(jq -c \
              --arg branch "${branch}" \
              --arg version "${build_version}" \
              '. + [{branch: $branch, version: $version}]' <<< "${targets}")
          done

          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  ls-ubuntu-pack:
    name: LS Ubuntu pack (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ls-ubuntu-pack-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@97fd67111e3c3ecdfafff96fc24d95ad909ab299 # v1.1.4
        with:
          version: 2201.13.3

      - name: Cache Ballerina dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.ballerina/repositories/
          key: ${{ runner.os }}-ballerina-${{ matrix.branch }}-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ballerina-${{ matrix.branch }}-

      - name: Pack with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion=${{ matrix.version }} pack -x check

      - name: Upload daily build jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: packages/ballerina-language-server/build/ballerina-language-server-${{ matrix.version }}.jar
          if-no-files-found: error

  ls-ubuntu-test:
    name: LS Ubuntu test (${{ matrix.branch }})
    needs:
      - ls-prepare-matrix
      - ls-ubuntu-pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ls-ubuntu-test-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      # Resolved from the matrix.branch checkout — the action file must
      # also exist on release branches in the matrix.
      - name: Run LS tests
        uses: ./.github/actions/ls-test
        with:
          cache-branch: ${{ matrix.branch }}
          gradle-version: ${{ matrix.version }}
          package-user: ${{ github.actor }}
          package-pat: ${{ secrets.GITHUB_TOKEN }}

  ls-windows-build:
    name: LS Windows build (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: ls-windows-build-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Enable long paths for Git
        shell: bash
        # Override the job default working-directory — it does not exist before checkout.
        working-directory: ${{ github.workspace }}
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@97fd67111e3c3ecdfafff96fc24d95ad909ab299 # v1.1.4
        with:
          version: 2201.13.3

      - name: Cache Ballerina dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: C:\Users\runneradmin\.ballerina\repositories\
          key: ${{ runner.os }}-ballerina-${{ matrix.branch }}-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ballerina-${{ matrix.branch }}-

      - name: Build with Gradle
        shell: cmd
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew.bat -Pversion=${{ matrix.version }} build

  # ─────────────────────────────────────────────────────────────────────────
  # Language server — Trivy vulnerability scan
  # ─────────────────────────────────────────────────────────────────────────
  ls-trivy:
    name: LS Trivy scan (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Generate SBOM
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew cyclonedxBom

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'sbom'
          scan-ref: 'packages/ballerina-language-server/build/sbom.json'
          format: 'table'
          timeout: '10m0s'
          exit-code: '1'
          trivyignores: packages/ballerina-language-server/.trivyignore

  # ─────────────────────────────────────────────────────────────────────────
  # Ballerina VSCode extension — build VSIX + tests
  # ─────────────────────────────────────────────────────────────────────────
  Build:
    name: Extension build
    needs: sync-nightly
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # Pin the nightly commit SHA rather than the branch name: the branch is
      # force-pushed every run, so a name would let a concurrent run swap the tree
      # out from under this build and produce a VSIX that matches no commit.
      ref: ${{ needs.sync-nightly.outputs.sha }}
      # ballerina: false — do NOT re-stamp the version. The checked-out nightly commit
      # already carries it in all three version files, and re-deriving the timestamp
      # here would produce a different version the moment the clock ticks past the
      # minute sync-nightly ran, leaving a VSIX that matches no commit.
      ballerina: false
      runFastTests: true
      runBalE2ETests: true
      # A nightly is a pre-release, so it is packaged like one: isPreRelease is exported
      # into the rush build env (actions/build), where common-libs/scripts/package-vsix.js
      # turns it into 'vsce package --pre-release'. Nightly and the dispatched pre-release
      # differ only in how they are branched and tagged, never in how they are packaged.
      #
      # Independent of the version, which is already committed on the nightly branch:
      # updateVersion is gated on 'ballerina', false above, so this cannot re-stamp it.
      isPreRelease: true
      nightly: true

  # ─────────────────────────────────────────────────────────────────────────
  # Daily pre-release — publish the extension VSIX as a GitHub pre-release
  # Gated on all verification jobs, including the LS Trivy scan, so a
  # dependency-scan failure blocks the daily pre-release.
  # ─────────────────────────────────────────────────────────────────────────
  Release:
    name: Publish daily pre-release
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    if: ${{ github.repository == 'ballerina-platform/ballerina-vscode' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # build.zip carries the full workspace (incl. .github/actions and the
      # built VSIX), so the local release action resolves without a checkout.
      - name: Restore build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExtBuild
          path: ./

      - name: Set up workspace
        run: |
          unzip build.zip
          rm build.zip

      - name: Publish pre-release
        uses: ./.github/actions/release
        with:
          repo: ${{ github.repository }}
          name: ballerina
          chatAPI: ${{ secrets.BI_TEAM_CHAT_API }}
          # Rolling tag: each daily run replaces the `nightly` release's assets in
          # place and moves the tag, so the download URL never changes and always
          # serves the latest build.
          tag: nightly
          # Attach the bundled language server too, so it is downloadable on its own
          # (debugging a nightly LS regression, or pointing an existing install at it
          # via the ballerina.langServerPath setting). This is the exact jar inside
          # the VSIX — copy-ls.js put it there — packed at the same parent version,
          # so the two assets can never disagree about what was built.
          extraAssets: packages/ballerina-extension/ls/ballerina-language-server-*.jar

  # ─────────────────────────────────────────────────────────────────────────
  # Notifications
  # ─────────────────────────────────────────────────────────────────────────
  NotifySuccess:
    name: Notify (success)
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    if: ${{ github.repository == 'ballerina-platform/ballerina-vscode' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExtBuild
          path: ./

      - name: Set up workspace
        run: |
          unzip build.zip
          rm build.zip

      - name: Notification - Ballerina
        uses: ./.github/actions/dailyBuildNotification
        with:
          title: Ballerina
          fileName: ballerina
          chatAPI: ${{ secrets.BI_TEAM_CHAT_API }}

  NotifyFailure:
    name: Notify (failure)
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    if: ${{ always() && contains(needs.*.result, 'failure') && github.repository == 'ballerina-platform/ballerina-vscode' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: "Failure Notification"
        uses: ./.github/actions/failure-notification
        with:
          title: "Daily Build Failed"
          run_id: ${{ github.run_id }}
          chat_api: ${{ secrets.EDITOR_TEAM_CHAT_API }}
          repository: ${{ github.repository }}
