name: Release LS

on:
  workflow_dispatch:
    inputs:
      is_prerelease:
        description: "Create a pre-release (RC) version"
        required: false
        type: boolean
        default: false
      skip_tests:
        description: "Skip running tests"
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: packages/ballerina-language-server

jobs:
  publish-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@17f84c3641ba7b8f6deff6309fc4c864478f5d62 # v3
        with:
          distribution: "temurin"
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache Ballerina dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-ballerina
        with:
          path: /home/runner/.ballerina/repositories/
          key: ${{ runner.os }}-ballerina-${{ github.base_ref || github.ref_name }}-${{ hashFiles('**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ballerina-${{ github.base_ref || github.ref_name }}-

      - name: Generate SBOM
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew cyclonedxBom

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: "sbom"
          scan-ref: "build/sbom.json"
          format: "table"
          timeout: "10m0s"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Set version env variable
        run: |
          # The language server has no independent version: it ships at the version in
          # the root package.json, the repo's single source of truth. gradle.properties
          # carries a generated copy, but read the root directly so a stale copy cannot
          # pick the version here — the -Pversion below then pins the build to it.
          BASE_VERSION=$(node -p "require('../../package.json').version" | sed 's/-SNAPSHOT$//')
          echo BASE_VERSION=${BASE_VERSION} >> $GITHUB_ENV

          if [ "${{ github.event.inputs.is_prerelease }}" == "true" ]; then
            # Pre release - determine the next RC number
            # Fetch all tags to check for existing RC tags
            git fetch --tags

            # Find the highest RC number for this base version
            HIGHEST_RC=$(git tag -l "v${BASE_VERSION}-rc.*" | sed "s/v${BASE_VERSION}-rc.//" | sort -n | tail -1)

            if [ -z "$HIGHEST_RC" ]; then
              # No RC tags found, start with rc1
              RC_NUMBER=1
            else
              # Increment the highest RC number
              RC_NUMBER=$((HIGHEST_RC + 1))
            fi

            echo VERSION=${BASE_VERSION}-rc.${RC_NUMBER} >> $GITHUB_ENV
            echo PRE_RELEASE=true >> $GITHUB_ENV
          else
            # Normal release - use the base version
            echo VERSION=${BASE_VERSION} >> $GITHUB_ENV
            echo PRE_RELEASE=false >> $GITHUB_ENV
          fi

      # Selects the commit the release tag will point at. It no longer mutates anything:
      # the version is owned by the root package.json, so this branch is identical to
      # the ref the workflow was dispatched on.
      - name: Check out the release branch
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          echo "Version: ${VERSION}"
          echo "Pre Release: ${PRE_RELEASE}"
          git config user.name ${{ secrets.BALLERINA_BOT_USERNAME }}
          git config user.email ${{ secrets.BALLERINA_BOT_EMAIL }}

          # Check if release branch exists in origin
          if git ls-remote --heads origin release-${BASE_VERSION} | grep -q release-${BASE_VERSION}; then
            echo "Branch release-${BASE_VERSION} exists in origin, checking out..."
            git fetch origin release-${BASE_VERSION}
            git checkout release-${BASE_VERSION}
          else
            echo "Branch release-${BASE_VERSION} does not exist, creating new branch..."
            git checkout -b release-${BASE_VERSION}
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # There is deliberately no './gradlew release' step. That task ran the
      # net.researchgate.release plugin, whose versionPropertyFile rewrote
      # gradle.properties (un-snapshot, then write the next dev version) and committed
      # it — which would silently desync the version from the root package.json that
      # now owns it, and 'Post release PR' below would carry the desync to main.
      # Everything that step provided is covered explicitly: the build below, and the
      # tag created by 'gh release create'.

      - name: Set up Ballerina
        uses: ballerina-platform/setup-ballerina@97fd67111e3c3ecdfafff96fc24d95ad909ab299 # v1.1.4
        with:
          version: 2201.13.3

      # -Pversion is required: without it this builds at whatever gradle.properties
      # says, which previously happened to be right only because the deleted 'release'
      # step had just un-snapshotted that file. 'gh release create' below uploads
      # build/ballerina-language-server-${VERSION}.jar, so the names must agree.
      - name: Build with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion=${VERSION} build pack ${{ github.event.inputs.skip_tests == 'true' && '-x test' || '' }}

      - name: Publish the artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
          BALLERINA_CENTRAL_ACCESS_TOKEN: ${{ secrets.BALLERINA_CENTRAL_ACCESS_TOKEN }}
          packageUser: ${{ secrets.BALLERINA_BOT_USERNAME }}
          packagePAT: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          ./gradlew -Pversion=${VERSION} publish -x check -x test

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.BALLERINA_BOT_TOKEN }}
        run: |
          gh release create v${{ env.VERSION }} \
            --title "ballerina-ls-v${{ env.VERSION }}" \
            --generate-notes \
            ${{ env.PRE_RELEASE == 'true' && '--prerelease' || '' }} \
            build/ballerina-language-server-${{ env.VERSION }}.jar

      # The 'Post release PR' step that used to close this workflow was removed with the
      # 'release' task. Its only purpose was to carry that task's version write-back on
      # the release branch into main; nothing here mutates the tree any more, so the PR
      # would be empty — and its head branch was pushed by that same deleted task.
      # The extension's release flow is what returns main to the next -SNAPSHOT
      # (.github/actions/pr).
