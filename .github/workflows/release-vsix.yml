name: Release Extension

on:
  workflow_dispatch:
    inputs:
      isPreRelease:
        description: 'Pre-release: version becomes major.(minor-1).<yymmddHHmm> and the VSIX is packaged with --pre-release. Unchecked = a real release at the root version minus -SNAPSHOT'
        required: true
        type: boolean
        default: true
      version:
        description: 'Explicit version override. Leave empty to derive the version from the root package.json'
        type: string
        required: false
        default: ''
      runFrontendTests:
        description: 'Run frontend tests (jest fast tests + Ballerina e2e)'
        type: boolean
        required: false
        default: false
      runBackendTests:
        description: 'Run backend tests (Ballerina language server tests)'
        type: boolean
        required: false
        default: false

jobs:
  Build:
    name: Build branch - ${{ github.ref_name }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      runOnAWS: false
      isPreRelease: ${{ inputs.isPreRelease }}
      enableCache: false
      ballerina: true
      version: ${{ inputs.version }}
      isReleaseBuild: true
      runFastTests: ${{ inputs.runFrontendTests }}
      runBalE2ETests: ${{ inputs.runFrontendTests }}
      runLSTests: ${{ inputs.runBackendTests }}

  Release:
    name: Release VSIX
    needs: Build
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Restore build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExtBuild
          path: ./

      - name: Set up workspace
        run: |
          unzip build.zip
          rm build.zip

      - name: Setup Rush
        uses: gigara/setup-rush@7ba3446572d15f5eacc85de383ad9679dfb7223c # v1.2.0
        with:
          pnpm: 10.11.0
          node: 22.x
          cache-rush: false
          cache-pnpm: false
          set-env: false
          rush-install: true

      - name: Get version
        id: vsix
        run: |
          file=$(ls ballerina-[0-9]*.[0-9]*.[0-9]*.vsix)
          vsixName=$(basename "$file" .vsix)
          echo "numericVersion=${vsixName#ballerina-}" >> $GITHUB_OUTPUT

      - name: Initiate release thread
        env:
          CHAT_API: ${{ secrets.EDITOR_TEAM_CHAT_API }}
        run: |
          # Unset on a fork, where this step would otherwise curl a URL that is just the
          # query string, fail, and take the job down before the release is created.
          if [ -z "${CHAT_API}" ]; then
            echo "::notice::EDITOR_TEAM_CHAT_API is not set; skipping the release thread."
            exit 0
          fi
          RELEASE_TYPE=${{ inputs.isPreRelease == true && 'Pre-release' || 'Release' }}
          body=$(cat << EOF
          {
            "thread": {"threadKey": "ballerina-release-${{ github.run_id }}"},
            "cards": [
              {
                "header": {
                  "title": "Ballerina v${{ steps.vsix.outputs.numericVersion }} $RELEASE_TYPE",
                  "subtitle": "${{ github.ref_name }} · triggered by ${{ github.actor }}"
                },
                "sections": [
                  {
                    "widgets": [
                      {
                        "keyValue": {
                          "topLabel": "Status",
                          "content": "Release workflow started",
                          "button": {
                            "textButton": {
                              "text": "View Workflow",
                              "onClick": {
                                "openLink": {
                                  "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                                }
                              }
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )
          curl -X POST \
            -H 'Content-Type: application/json' \
            "${CHAT_API}&messageReplyOption=REPLY_MESSAGE_FALLBACK_TO_NEW_THREAD" \
            -d "$body"

      - name: Create a release in ${{ github.repository }} repo
        uses: ./.github/actions/release
        with:
          repo: ${{ github.repository }}
          name: ballerina
          chatAPI: ${{ secrets.EDITOR_TEAM_CHAT_API }}
          threadKey: ballerina-release-${{ github.run_id }}

      - name: BI Team Release Announcement
        env:
          CHAT_API: ${{ secrets.BI_TEAM_CHAT_API }}
        run: |
          if [ -z "${CHAT_API}" ]; then
            echo "::notice::BI_TEAM_CHAT_API is not set; skipping the release announcement."
            exit 0
          fi
          body=$(cat << EOF
          {
            "cards": [
              {
                "header": {
                  "title": "Ballerina v${{ steps.vsix.outputs.numericVersion }} Released",
                  "subtitle": "VS Code Extension"
                },
                "sections": [
                  {
                    "widgets": [
                      {
                        "keyValue": {
                          "topLabel": "Release",
                          "content": "v${{ steps.vsix.outputs.numericVersion }}",
                          "button": {
                            "textButton": {
                              "text": "Download",
                              "onClick": {
                                "openLink": {
                                  "url": "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.vsix.outputs.numericVersion }}"
                                }
                              }
                            }
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          EOF
          )
          curl -X POST \
            -H 'Content-Type: application/json' \
            "${CHAT_API}" \
            -d "$body"

      # No 'version' input: the action reads the released version from the root package.json,
      # which is what the build packaged. Passing it in meant passing the VSIX basename.
      - name: Create PR and notify
        uses: ./.github/actions/pr
        with:
          isPreRelease: ${{ github.event.inputs.isPreRelease }}
          ref_name: ${{ github.ref_name }}
          ballerina: true
          chatAPI: ${{ secrets.EDITOR_TEAM_CHAT_API }}
          threadKey: ballerina-release-${{ github.run_id }}

  Notify:
    needs: [Release]
    if: ${{ always() && contains(needs.*.result, 'failure') && github.repository == 'ballerina-platform/ballerina-vscode' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: "Failure Notification"
        uses: ./.github/actions/failure-notification
        with:
          title: "Release Build Failed"
          run_id: ${{ github.run_id }}
          chat_api: ${{ secrets.EDITOR_TEAM_CHAT_API }}
          repository: ${{ github.repository }}
          thread_key: ballerina-release-${{ github.run_id }}
